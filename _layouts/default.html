---
layout: compress
---

<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="author" content="{{site.title}}">
        <meta name="description" content="{{ page.description | default: site.description | escape }}">
        <meta name="keywords" content="{{site.keywords}}">
        <title>{{ page.title | default: site.title | escape }}</title>

        <link rel="canonical" href="{{ page.url | absolute_url }}">

        <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
        <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
        <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
        <meta property="og:url" content="{{ page.url | absolute_url }}">
        <meta property="og:site_name" content="{{site.title}}">

        <meta name="twitter:card" content="summary">
        <meta name="twitter:site" content="@{{site.twitter_username}}">

        {% unless site.feedless %}
            <link rel="alternate" type="application/rss+xml"
                title="{{ site.title | escape }}: Thoughts"
                href="{{ '/feed.xml' | relative_url }}">
        {% endunless %}

        {% if site.favicon %}
            <link rel="icon" type="image/png" href="{{ site.favicon | relative_url }}">
        {% endif %}

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/normalize/7.0.0/normalize.min.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?display=swap&family=Lato|Oswald|Noto+Color+Emoji"/>

        <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}"/>
        {% if page.stylesheet %}
            <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}"/>
        {% endif %}

        {% for script in site.js.early %}
            <script type="text/javascript" src="{{ script | relative_url }}"></script>
        {% endfor %}

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0-alpha2/katex.min.css"
            integrity="sha384-exe4Ak6B0EoJI0ogGxjJ8rn+RN3ftPnEQrGwX59KTCl5ybGzvHGKjhPKk/KC3abb"
            crossorigin="anonymous" />

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0-alpha2/katex.min.js"
            integrity="sha384-OMvkZ24ANLwviZR2lVq8ujbE/bUO8IR1FdBrKLQBI14Gq5Xp/lksIccGkmKL8m+h"
            crossorigin="anonymous" defer></script>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0-alpha2/contrib/auto-render.min.js"
            integrity="sha384-cXpztMJlr2xFXyDSIfRWYSMVCXZ9HeGXvzyKTYrn03rsMAlOtIQVzjty5ULbaP8L"
            crossorigin="anonymous" defer></script>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                if (typeof katex === 'undefined' || typeof renderMathInElement === 'undefined') return;
                /* Kramdown emits math/tex scripts for Markdown equations. */
                document.querySelectorAll('script[type^="math/tex"]').forEach(function(math) {
                    var element = document.createElement(math.type.indexOf('mode=display') !== -1 ? 'div' : 'span');
                    katex.render(math.textContent, element, {
                        displayMode: math.type.indexOf('mode=display') !== -1,
                        throwOnError: false
                    });
                    math.parentNode.replaceChild(element, math);
                });
                renderMathInElement(
                    document.body,
                    {
                        delimiters: [
                            {left: "$$", right: "$$", display: true},
                            {left: "\\[", right: "\\]", display: true},
                            {left: "$", right: "$", display: false},
                            {left: "\\(", right: "\\)", display: false}
                        ]
                    }
                );
            });
        </script>
    </head>

    <body>
        {{content}}
        {% for script in site.js.late %}
            <script type="text/javascript" src="{{ script | relative_url }}"></script>
        {% endfor %}
        <script>
            (function() {
                var html = document.documentElement;
                var stored = localStorage.getItem('theme');
                if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    html.classList.add('dark-mode');
                }
                var btn = document.getElementById('theme-toggle');
                if (btn) {
                    btn.textContent = html.classList.contains('dark-mode') ? '\u2600\uFE0F' : '\uD83C\uDF19';
                    btn.addEventListener('click', function() {
                        html.classList.toggle('dark-mode');
                        localStorage.setItem('theme', html.classList.contains('dark-mode') ? 'dark' : 'light');
                        btn.textContent = html.classList.contains('dark-mode') ? '\u2600\uFE0F' : '\uD83C\uDF19';
                        swapProfilePic();
                    });
                }
                swapProfilePic();
                function swapProfilePic() {
                    var pic = document.getElementById('profile-pic');
                    if (pic) {
                        pic.src = html.classList.contains('dark-mode') ? {{ '/assets/headphones_me.jpg' | relative_url | jsonify }} : {{ '/assets/hanten_me.jpg' | relative_url | jsonify }};
                    }
                }
            })();
        </script>
    </body>
</html>
